services:
  docker-set-api:
    build: ../../api
    container_name: docker-set-api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # The privileged work happens in the Docker daemon via the socket, not in
    # this container, so it needs no Linux capabilities of its own
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      # Repository mounted at the SAME path as on the host: bind mounts
      # issued by the scripts (docker compose in sites/<name>) resolve on
      # the host daemon
      DOCKER_SET_DIR: ${DOCKER_SET_ROOT}
    ports:
      # Localhost only — reach /api through SSH or a tunnel, never expose it
      # on a public interface
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_SET_ROOT}:${DOCKER_SET_ROOT}
      # Source and executable trees mounted read-only so a compromised API
      # process cannot rewrite the scripts it later runs (as root, via the
      # socket). sites/, backups/ and config/ stay writable via the mount above.
      - ${DOCKER_SET_ROOT}/scripts:${DOCKER_SET_ROOT}/scripts:ro
      - ${DOCKER_SET_ROOT}/lib:${DOCKER_SET_ROOT}/lib:ro
      - ${DOCKER_SET_ROOT}/templates:${DOCKER_SET_ROOT}/templates:ro
      - ${DOCKER_SET_ROOT}/api:${DOCKER_SET_ROOT}/api:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

    # Optional: expose ONLY the GitHub webhook publicly through Traefik.
    # Uncomment the labels and networks blocks (and the networks section at
    # the bottom), set your hostname, then recreate the container.
    # The PathPrefix keeps /api and /health unrouted; even so, /api stays
    # behind the Bearer token — never weaken that assumption.
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.docker-set-api.rule=Host(`hooks.example.com`) && PathPrefix(`/hooks/`)"
    #   - "traefik.http.routers.docker-set-api.entrypoints=websecure"
    #   - "traefik.http.routers.docker-set-api.tls.certresolver=le"
    #   - "traefik.http.services.docker-set-api.loadbalancer.server.port=9000"
